[package]
name = "basket"
version = "0.1.0"
description = "Stocklana basket: partial redemption, balance-as-truth accounting, no oracle"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "basket"

[features]
default = ["no-idl"]  # on-chain IDL instructions not needed; saves ~38 KB of deploy rent
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
